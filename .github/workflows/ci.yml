name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Regenerate icons
        run: npm run icons

      - name: Build extension
        run: npm run build

      - name: Upload built extension
        uses: actions/upload-artifact@v4
        with:
          name: leetmeow-dist
          path: dist/
          retention-days: 14
